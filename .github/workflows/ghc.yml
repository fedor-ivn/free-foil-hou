name: GHC (build, test, haddock)

# Controls when the workflow will run
'on':
  push:
    branches:
      - main
    tags: [v*]
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # to submit Haddock documentation to GitHub Pages

jobs:
  tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # GHC 9.8.2's linker cannot read the SDK stubs on macos-26.
        os: [ubuntu-latest, windows-latest, macos-15]
      fail-fast: false
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.ref }}

      - name: 🧰 Setup Stack
        uses: freckle/stack-action@v5
        with:
          stack-build-arguments: --pedantic
          stack-build-arguments-build: --dry-run
          stack-build-arguments-test: --ghc-options -O2 --reconfigure --force-dirty --ghc-options -fforce-recomp

      - name: Run README matching example
        run: stack exec -- runghc -package=free-foil-hou examples/Matching.hs

  docs:
    needs: [tests]
    name: "Build (all) and upload haddock (only main)"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 🧰 Setup Stack
        uses: freckle/stack-action@v5
        with:
          test: false
          stack-build-arguments: --fast --haddock --no-nix
          cache-prefix: docs-

      - name: Download pipeline artifact
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-files-${{ runner.os }}
          merge-multiple: true

      - name: Add haddock
        run: |
          mkdir -p dist/haddock
          mv $(stack path --local-doc-root)/* dist/haddock

      - name: 🚀 Publish Site
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ github.ref_name == 'main' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist
          single-commit: true